name: Convert AI models to Core ML

on:
  workflow_dispatch:
  push:
    branches: [ "feature/beautify-natural-grading" ]
    paths:
      - ".github/workflows/convert-ai-models.yml"

permissions:
  contents: read

jobs:
  convert:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout app and conversion scripts
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 torch==2.2.2 torchvision==0.17.2 coremltools==7.2
          python -m pip install addict future lmdb lpips==0.1.4 opencv-python-headless==4.10.0.84 Pillow PyYAML requests scipy tqdm yapf
          python -m pip install numpy==1.26.4
          python -c "import numpy, torch, lpips; print('NumPy', numpy.__version__, '| PyTorch', torch.__version__, '| LPIPS ready')"

      - name: Clone official CodeFormer source
        run: |
          git clone --depth 1 https://github.com/sczhou/CodeFormer.git

      - name: Download official model checkpoints
        run: |
          mkdir -p CodeFormer/weights/CodeFormer weights
          curl -fL --retry 5 --retry-delay 3 https://github.com/sczhou/CodeFormer/releases/download/v0.1.0/codeformer.pth -o CodeFormer/weights/CodeFormer/codeformer.pth
          curl -fL --retry 5 --retry-delay 3 https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth -o weights/RealESRGAN_x4plus.pth
          ls -lh CodeFormer/weights/CodeFormer/codeformer.pth weights/RealESRGAN_x4plus.pth

      - name: Convert CodeFormer
        run: python tools/coreml_conversion/convert_codeformer.py

      - name: Convert Real-ESRGAN x4plus
        run: python tools/coreml_conversion/convert_realesrgan.py

      - name: Package Core ML models
        run: |
          cd artifacts
          zip -qry ../iOS-CoreML-models.zip CodeFormer.mlpackage RealESRGAN_x4plus.mlpackage
          cd ..
          ls -lh iOS-CoreML-models.zip

      - name: Upload Core ML model artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-CoreML-models
          path: iOS-CoreML-models.zip
          if-no-files-found: error
          retention-days: 7
