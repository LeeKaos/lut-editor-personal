name: Build iPhone app

on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Get app source
        uses: actions/checkout@v4

      - name: Generate app icon PNG
        run: |
          brew install librsvg
          rsvg-convert -w 1024 -h 1024 LUTStudioOffline/Assets.xcassets/AppIcon.appiconset/AppIcon.svg -o LUTStudioOffline/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Build for iPhone
        run: |
          xcodebuild \
            -project LUTStudioOffline.xcodeproj \
            -scheme LUTStudioOffline \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/LUTStudioOffline.app package/Payload/
          cd package
          /usr/bin/zip -qry ../LUTEditor-unsigned.ipa Payload

      - name: Save IPA build
        uses: actions/upload-artifact@v4
        with:
          name: LUTEditor-unsigned-ipa
          path: LUTEditor-unsigned.ipa
          if-no-files-found: error
