name: Build LumaGrade IPA

on:
  push:
    branches: [codex/lumagrade-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Convert DeepLPF model to Core ML
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 Pillow==11.1.0 matplotlib==3.10.0 scikit-image==0.25.2 coremltools==9.0 torch==2.7.0
          git clone --filter=blob:none https://github.com/sjmoran/deeplpf-image-enhancement.git "$RUNNER_TEMP/deeplpf-source"
          git -C "$RUNNER_TEMP/deeplpf-source" checkout 4faeef6597f299d38acc597df9cfe970f8d90ca2
          python Scripts/convert_deeplpf_coreml.py \
            --source "$RUNNER_TEMP/deeplpf-source" \
            --output LumaGrade/DeepLPFModels/DeepLPF.mlpackage
      - name: Prepare compact bundled LUTs
        run: python3 Scripts/prepare_luts.py
      - name: Build unsigned iPhone app
        run: xcodebuild -project LumaGrade.xcodeproj -scheme LumaGrade -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Verify iPhone app package metadata
        run: |
          set -euxo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/LumaGrade.app"
          test -s "$APP_PATH/LumaGrade"
          test -d "$APP_PATH/DeepLPFModels/DeepLPF.mlpackage"
          test -s "$APP_PATH/DeepLPFModels/DeepLPF.mlpackage/Manifest.json"
          test -s "$APP_PATH/DeepLPFModels/DeepLPF.mlpackage/Data/com.apple.CoreML/model.mlmodel"
          DEEPLPF_SIZE=$(du -sm "$APP_PATH/DeepLPFModels/DeepLPF.mlpackage" | cut -f1)
          echo "Bundled DeepLPF Core ML size: ${DEEPLPF_SIZE} MB"
          plutil -lint "$APP_PATH/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP_PATH/Info.plist")" = "AppIcon"
          find "$APP_PATH" -maxdepth 1 -type f -iname '*appicon*.png' | grep -q .
          test -d "$APP_PATH/LUTs"
          LUT_COUNT=$(find "$APP_PATH/LUTs" -type f -name '*.lutf' | wc -l | tr -d ' ')
          echo "Bundled LUT count: $LUT_COUNT"
          test "$LUT_COUNT" -eq 101
          test -s "$APP_PATH/LUTs/AppleLog.lutf"
          test -s "$APP_PATH/LUTs/DJI Mini 4 Pro D-Log M to Rec709.lutf"
          test -s "$APP_PATH/LUTs/AppleLog2.lutf"
          test -s "$APP_PATH/LUTs/Cinematic/Cinematic.lutf"
          ARCHS=$(/usr/bin/lipo -archs "$APP_PATH/LumaGrade")
          [[ " $ARCHS " == *" arm64 "* ]]
      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/LumaGrade.app package/Payload/
          cd package
          /usr/bin/zip -qry ../LumaGrade-unsigned.ipa Payload
          /usr/bin/unzip -tq ../LumaGrade-unsigned.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaGrade-unsigned-ipa
          path: LumaGrade-unsigned.ipa
          if-no-files-found: error
