name: Build LumaGrade IPA

on:
  push:
    branches: [codex/lumagrade-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare compact bundled LUTs
        run: python3 Scripts/prepare_luts.py
      - name: Build unsigned iPhone app
        run: xcodebuild -project LumaGrade.xcodeproj -scheme LumaGrade -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Verify iPhone app package metadata
        run: |
          set -euxo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/LumaGrade.app"
          test -s "$APP_PATH/LumaGrade"
          plutil -lint "$APP_PATH/Info.plist"
          test -d "$APP_PATH/LUTs"
          LUT_COUNT=$(find "$APP_PATH/LUTs" -type f -name '*.lutf' | wc -l | tr -d ' ')
          echo "Bundled LUT count: $LUT_COUNT"
          test "$LUT_COUNT" -eq 100
          ARCHS=$(/usr/bin/lipo -archs "$APP_PATH/LumaGrade")
          [[ " $ARCHS " == *" arm64 "* ]]
      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/LumaGrade.app package/Payload/
          cd package
          /usr/bin/zip -qry ../LumaGrade-unsigned.ipa Payload
          /usr/bin/unzip -tq ../LumaGrade-unsigned.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaGrade-unsigned-ipa
          path: LumaGrade-unsigned.ipa
          if-no-files-found: error
